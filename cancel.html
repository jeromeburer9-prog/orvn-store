<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ORVN. — Checkout abgebrochen</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #0a0a0a;

      color: #d8d2c7;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;
    }

    .container {

      width: 100%;

      max-width: 650px;

      text-align: center;

      border: 1px solid #30302d;

      padding: 60px 30px;
    }

    .logo {

      font-size: 44px;

      font-weight: 900;

      letter-spacing: -3px;

      margin-bottom: 50px;
    }

    .label {

      color: #7a1717;

      font-size: 11px;

      letter-spacing: 4px;

      margin-bottom: 20px;
    }

    h1 {

      font-size: 48px;

      margin: 0 0 20px;

      text-transform: uppercase;
    }

    p {

      color: #99958e;

      line-height: 1.7;

      margin-bottom: 35px;
    }

    a {

      display: inline-block;

      padding: 16px 26px;

      background: #d8d2c7;

      color: #0a0a0a;

      text-decoration: none;

      font-weight: 800;
    }

  </style>

</head>


<body>

  <main class="container">

    <div class="logo">
      ORVN.
    </div>

    <div class="label">
      CHECKOUT / CANCELLED
    </div>

    <h1>
      NO PROBLEM.
    </h1>

    <p>
      Deine Zahlung wurde nicht abgeschlossen.
      Dein Warenkorb bleibt erhalten.
    </p>

    <a href="/">
      ZURÜCK ZU ORVN
    </a>

  </main>

</body>

</html>
